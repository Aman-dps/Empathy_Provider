<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empathy AI Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Modern Premium UI */
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        #chat-container { 
            width: 450px; 
            height: 600px;
            background: rgba(22, 33, 62, 0.8); 
            backdrop-filter: blur(10px);
            border-radius: 20px; 
            padding: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            display: flex; 
            flex-direction: column; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 {
            text-align: center; 
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e94560;
        }
        #chat-history { 
            flex-grow: 1; 
            overflow-y: auto; 
            margin-bottom: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            padding-right: 10px;
        }
        /* Custom Scrollbar */
        #chat-history::-webkit-scrollbar { width: 6px; }
        #chat-history::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .msg { 
            padding: 12px 16px; 
            border-radius: 15px; 
            max-width: 75%; 
            line-height: 1.4;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user { 
            background: #0f3460; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px;
        }
        .bot { 
            background: #e94560; 
            align-self: flex-start; 
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }
        .input-group { 
            display: flex; 
            gap: 10px; 
        }
        input { 
            flex-grow: 1;
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(0,0,0,0.2);
            color: white;
            outline: none; 
            font-family: 'Inter', sans-serif;
            transition: border 0.3s ease;
        }
        input:focus {
            border: 1px solid #e94560;
        }
        input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        button { 
            padding: 0 20px; 
            border-radius: 12px; 
            border: none; 
            background: #e94560; 
            color: white; 
            cursor: pointer; 
            font-weight: 600; 
            font-family: 'Inter', sans-serif;
            transition: transform 0.1s ease, background 0.3s ease;
        }
        button:hover {
            background: #ff5c77;
        }
        button:active {
            transform: scale(0.95);
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 5px 0;
        }
        .dot {
            width: 6px; height: 6px; background: white; border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="chat-container">
        <h2>Empathy AI</h2>
        <div id="chat-history">
            <div class="msg bot">Hello! I'm here to listen. How are you feeling today?</div>
        </div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script>
        async function sendMessage() {
            const input = document.getElementById("userInput");
            const history = document.getElementById("chat-history");
            const text = input.value.trim();
            if (!text) return;
            
            // Add user message
            history.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = "";
            history.scrollTop = history.scrollHeight;

            // Add typing indicator
            const typingId = 'typing-' + Date.now();
            history.innerHTML += `
                <div class="msg bot" id="${typingId}">
                    <div class="typing-indicator">
                        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    </div>
                </div>`;
            history.scrollTop = history.scrollHeight;

            // Fetch response
            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                
                // Replace typing indicator with actual response
                document.getElementById(typingId).remove();
                history.innerHTML += `<div class="msg bot">${data.response}</div>`;
                history.scrollTop = history.scrollHeight;
            } catch (error) {
                document.getElementById(typingId).remove();
                history.innerHTML += `<div class="msg bot" style="background:#ff3333;">Error connecting to the AI model. Is the server running?</div>`;
            }
        }
    </script>
</body>
</html>
